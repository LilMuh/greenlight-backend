<!DOCTYPE html>
<!--/*
  开球时段提醒邮件。所有文案和格式化都由 AlertMailFactory 算好后传进来，
  这里只负责排版。

  写法受邮件客户端限制，不是普通网页那一套：
    - 布局用 <table>，不用 flex/grid（Outlook 桌面版走 Word 排版引擎，不支持）
    - 样式全部内联；<head> 里唯一那条 @media 只把窄屏的左右留白从 32px 收到 20px，
      整块被 Gmail 剥掉也不影响阅读
    - 不引外部字体、CSS，也不用图片：视觉全靠色块、1px 细线和字体本身
    - 每个文字格都带 mso-line-height-rule:exactly，每张表每个格都给显式宽度
    - 宽度锁 600px，是各家客户端阅读区的安全宽度

  结构：品牌条 / 球场短名 / 按日期分组的时段块（一天一条预订链接）/ 页脚（含改条件入口）。
*/-->
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title th:text="${subject}">GreenLight</title>
  <style>
    @media only screen and (max-width:480px) {
      .gutter { padding-left:20px !important; padding-right:20px !important; }
    }
  </style>
  <!--[if mso]>
  <style>body,table,td,a,div,span{font-family:Arial,Helvetica,sans-serif !important;}</style>
  <![endif]-->
</head>
<body style="margin:0; padding:0; background-color:#efe9df; -webkit-font-smoothing:antialiased;">

<!--/* 收件箱列表里标题后面那截灰字：正文里不可见 */-->
<span style="display:none; font-size:1px; color:#efe9df; line-height:1px; max-height:0; max-width:0; opacity:0; overflow:hidden;"
      th:text="${preheader}">Fri, Aug 7 18:18 · Sun, Aug 9 07:30 and 14:06 — inside your alert window.</span>

<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#efe9df;">
  <tr>
    <td align="center" style="padding:24px 12px;">

      <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="600"
             style="width:100%; max-width:600px; background-color:#ffffff;">

        <!--/* 品牌条：整封邮件唯一的色块 */-->
        <tr>
          <td bgcolor="#e6ede8" class="gutter"
              style="background-color:#e6ede8; padding:16px 32px; font-family:Arial,Helvetica,sans-serif; font-size:12px; line-height:16px; mso-line-height-rule:exactly; letter-spacing:0.16em; color:#5d7d6c;">GREENLIGHT</td>
        </tr>

        <!--/*
          球场短名（Java 那边已经去掉「Golf Course」并转成大写），地点跟在后面。
          地点用页脚同一档的次要灰小字，并把这一格的字距和粗细还原成常规，
          免得跟着球场名一起被拉开。查不到地点时整段不渲染。
        */-->
        <tr>
          <td class="gutter"
              style="padding:24px 32px 0 32px; font-family:'Arial Black','Arial Bold',Arial,Helvetica,sans-serif; font-size:16px; line-height:20px; mso-line-height-rule:exactly; letter-spacing:0.10em; font-weight:bold; color:#1a7f4f;"><span th:text="${courseLabel}">FRASERVIEW</span><span th:if="${location}" style="font-family:Arial,Helvetica,sans-serif; font-size:12px; line-height:20px; mso-line-height-rule:exactly; letter-spacing:normal; font-weight:normal; color:#6b7280;">&nbsp;&nbsp;·&nbsp;&nbsp;<span th:text="${location}">Vancouver, BC</span></span></td>
        </tr>

        <!--/* 一天一个块 */-->
        <tr th:each="group : ${groups}">
          <td class="gutter" style="padding:20px 32px 0 32px;">
            <table role="presentation" width="536" cellpadding="0" cellspacing="0" border="0" style="width:100%;">

              <!--/* 日期 + 当天那条预订链接。没配链接模板时右边那格整个不渲染 */-->
              <tr>
                <td style="padding:0 0 8px 0;">
                  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                    <tr>
                      <td align="left" valign="bottom"
                          style="font-family:'Palatino Linotype','Book Antiqua',Palatino,Georgia,serif; font-size:18px; line-height:22px; mso-line-height-rule:exactly; font-weight:bold; color:#201e1d;"
                          th:text="${group.date}">Fri, Aug 7</td>
                      <!--/* 下划线只给 BOOK 这个词：连着后面那段空隙和箭头一起划会拖出一条空尾巴 */-->
                      <td th:if="${group.bookingUrl}" align="right" valign="bottom"
                          style="font-family:Arial,Helvetica,sans-serif; font-size:12px; line-height:20px; mso-line-height-rule:exactly; letter-spacing:0.06em;">
                        <a th:href="${group.bookingUrl}" href="#"
                           style="color:#1a7f4f; text-decoration:none;"><span style="text-decoration:underline;">BOOK</span> &nbsp;&rarr;</a></td>
                    </tr>
                  </table>
                </td>
              </tr>

              <!--/* 时段行：时间 / 空位 / 价格三列，各自带 width 属性给 Outlook、百分比给手机 */-->
              <tr th:each="card : ${group.slots}">
                <td style="padding:0;">
                  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                    <tr>
                      <td width="200" align="left" valign="middle"
                          style="width:40%; border-top:1px solid #f0ebe2; padding:8px 0; font-family:Arial,Helvetica,sans-serif; font-size:15px; line-height:20px; mso-line-height-rule:exactly; color:#201e1d;"
                          th:text="${card.time}">18:18</td>
                      <td width="176" align="left" valign="middle"
                          style="width:30%; border-top:1px solid #f0ebe2; padding:8px 0; font-family:Arial,Helvetica,sans-serif; font-size:12px; line-height:20px; mso-line-height-rule:exactly; color:#6b7280;"
                          th:text="${card.seats}">4 spots</td>
                      <td width="160" align="right" valign="middle"
                          style="width:30%; border-top:1px solid #f0ebe2; padding:8px 0; font-family:Arial,Helvetica,sans-serif; font-size:15px; line-height:20px; mso-line-height-rule:exactly; color:#201e1d;"
                          th:text="${card.price}">$52.00</td>
                    </tr>
                  </table>
                </td>
              </tr>

            </table>
          </td>
        </tr>

        <!--/* 页脚：说明为什么会收到这封信，并把 watch 的筛选条件平铺出来 */-->
        <tr>
          <td class="gutter" style="padding:24px 32px 24px 32px;">
            <table role="presentation" width="536" cellpadding="0" cellspacing="0" border="0" style="width:100%;">
              <tr>
                <td style="border-top:1px solid #e5e1d8; padding:12px 0 0 0; font-family:Arial,Helvetica,sans-serif; font-size:12px; line-height:18px; mso-line-height-rule:exactly; color:#6b7280;">
                  <span th:text="${footerNote}">You set up a GreenLight alert for Fraserview Golf Course.</span><br>
                  <span th:text="${criteria}">4 players · Aug 4 – Aug 11 · 06:00 – 10:00 · up to $90</span>
                </td>
              </tr>

              <!--/*
                改条件 / 退订的唯一入口——这个后端没有账号体系，不给这条链接，
                收件人就只能自己记住前端地址。写法和上面每天那条 BOOK 一致：
                下划线只给词本身，箭头和它之间那段空隙不划。没配 manage-url 则整行不渲染。
              */-->
              <tr th:if="${manageUrl}">
                <td style="padding:12px 0 0 0; font-family:Arial,Helvetica,sans-serif; font-size:12px; line-height:20px; mso-line-height-rule:exactly; letter-spacing:0.06em;">
                  <a th:href="${manageUrl}" href="#"
                     style="color:#1a7f4f; text-decoration:none;"><span style="text-decoration:underline;">MANAGE ALERTS</span> &nbsp;&rarr;</a></td>
              </tr>
            </table>
          </td>
        </tr>

      </table>

    </td>
  </tr>
</table>

</body>
</html>
