server:
  port: 8080

# 日志按 UTF-8 输出。不写死的话 logback 跟着 JVM 默认编码走，
# 在中文 Windows 上会变成 GBK，中文日志出去就是乱码。
logging:
  charset:
    console: UTF-8
    file: UTF-8

spring:
  # 路径不存在时抛异常，交给 ApiExceptionHandler 渲染成 {"code":"ENDPOINT_NOT_FOUND"}。
  # 默认行为是转到内置的 /error 页，回一段 Whitelabel HTML——前端拿到的就是一坨
  # 解析不了的东西，只能显示笼统提示。这个后端不提供任何静态资源，所以顺手把静态
  # 资源映射也关掉：不关的话找不到的路径会先被当成静态文件，轮不到上面那个异常。
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false
  datasource:
    url: jdbc:postgresql://localhost:5432/greenlight
    username: greenlight
    password: change-me
  jpa:
    hibernate:
      # schema 由 greenlight-database 的 Liquibase 拥有，这里只校验实体和表是否对得上
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  # 迁移不归后端管
  liquibase:
    enabled: false
  # 邮件模板不缓存：改完 templates/mail/*.html 刷新 /api/notifications/preview 就能看到，不用重启
  thymeleaf:
    cache: false
  # SMTP 连接参数，只有 greenlight.mail.mode=prod（真发邮件）时才会用到。
  # 默认按 Gmail 填好；换服务商只改 host/port。Gmail 必须用「应用专用密码」，不是账号登录密码。
  mail:
    host: ${GREENLIGHT_SMTP_HOST:smtp.gmail.com}
    port: ${GREENLIGHT_SMTP_PORT:587}
    username: ${GREENLIGHT_SMTP_USER:}
    password: ${GREENLIGHT_SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      # 别让 SMTP 卡死抓取线程
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

greenlight:
  api:
    # /api/** 的共享密钥（见 ApiKeyFilter）。留空 = 关卡关闭，本地开发不用带头。
    # 公网暴露（Tailscale Funnel）时必须设：GREENLIGHT_API_KEY=...
    key: ${GREENLIGHT_API_KEY:}
  # 定时抓取节奏（TeeTimeScrapeTask）
  scrape:
    initial-delay-ms: 0        # 启动即先抓一轮
    interval-ms: 900000        # 之后每隔 15 分钟（上一轮结束算起）
  # 球场的地址/评分（Google Maps）多久刷一次。不是独立定时器——
  # 挂在每轮抓取上，超过这个天数的球场会被捎带着刷新一次。见 CourseInfoService。
  # 地址还是空的球场不受这个限制，下一轮抓取就会去补。
  course-info:
    max-age-days: 7
  mail:
    # dev=只写日志不真发（本地默认）；prod=走 SMTP 真发，需要 spring.mail.username/password
    mode: ${GREENLIGHT_MAIL_MODE:dev}
    # 发件地址。Gmail 等服务商要求发件人 = 认证账号，所以默认就取 SMTP 用户名
    from: ${GREENLIGHT_MAIL_FROM:${GREENLIGHT_SMTP_USER:greenlight@example.com}}
    # 邮件里「Book this time」按钮的链接。占位符见 MailProperties；置空则不渲染按钮。
    # 参数名是 2026-08-04 用 OAB 驱动真实浏览器实测的（Date / Player / Hole /
    # TeeOffTimeMin / TeeOffTimeMax，首字母大写，跟它转给后端 API 的那套名字不同）。
    # 点进去落到指定日期、开球前后各 1 小时的时段列表。
    #
    # 【故意不带 Player】落地页会把它原样转成 TeeTimes 接口的 numberOfPlayer，而这个参数
    # 不只决定显示几个空位——它会把「不接受这个人数」的时段整条筛掉（2026-08-25 实测：
    # 同一天同一批球场，numberOfPlayer=4 比 =2 少返回一条 minPlayer=2/maxPlayer=2 的时段）。
    # scraper 抓取用的是 numberOfPlayer=0、即不筛，两边口径一旦不一致，一条 minPlayer 大于
    # watch 人数的时段就会「我们发得出提醒、收信人点进去找不到」——2026-08-25 McCleery /
    # Langara 那两封 13:33 的提醒就是这么来的。不给 Player，落地页自己发的就是
    # numberOfPlayer=0，正好对上。前端查询页出于同样理由也不带，见 main.js。
    # 想加回去之前先看 BookingUrlTemplateDefaultTest。
    booking-url-template: "https://{site}.cps.golf/onlineresweb/search-teetime?Date={date}&TeeOffTimeMin={timeMin}&TeeOffTimeMax={timeMax}&Hole={holes}"
    # 球场地点，按 site 配。course 表没有地点列（表结构归 greenlight-database），
    # 先用站点级的地区名顶上；查不到就不显示地点那行。
    site-locations:
      golfvancouver: "Vancouver, BC"
      golfburnaby: "Burnaby, BC"
    # 页脚「MANAGE ALERTS →」指向的前端 watch 编辑页。默认是公开部署的那份；
    # 本地调试指回自己的静态服务：GREENLIGHT_MANAGE_URL=http://localhost:5500/config.html
    # 置空则页脚不渲染这条链接。
    manage-url: ${GREENLIGHT_MANAGE_URL:https://lilmuh.github.io/greenlight-frontend/config.html}
