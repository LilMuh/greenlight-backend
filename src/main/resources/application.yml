server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/greenlight
    username: greenlight
    password: change-me
  jpa:
    hibernate:
      # schema 由 greenlight-database 的 Liquibase 拥有，这里只校验实体和表是否对得上
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  # 迁移不归后端管
  liquibase:
    enabled: false

# 定时抓取节奏（TeeTimeScrapeTask）
greenlight:
  scrape:
    initial-delay-ms: 0        # 启动即先抓一轮
    interval-ms: 3600000       # 之后每隔 1 小时（上一轮结束算起）
  mail:
    # dev=只写日志不真发（本地默认）；prod=走 SMTP，另需配 spring.mail.* 和下面的 from
    mode: ${GREENLIGHT_MAIL_MODE:dev}
    from: ${GREENLIGHT_MAIL_FROM:greenlight@example.com}
